Screens:
  AdminScreen:
    Properties:
      Fill: =RGBA(248, 250, 252, 1)
      OnVisible: |-
        =// Kapa-Regel: ein Eintrag ist aktiv, wenn Laufzeit (Enddatum) >= Heute.
        // Future-Bookings (Startdatum > Heute) zaehlen ebenfalls als verplante Kapazitaet.
        // Gruppierung erfolgt auf der SP-Spalte 'Person' (Person or Group).
        // Aktive Eintraege mit Person-Infos + Auslastung als 0..100 Prozent
        // Schritt 1: Server-seitiger Filter (delegierbar)
        ClearCollect(colLaufendeEintraege, Filter('MS-NUE-Einsatzplan', Laufzeit >= Today()));
        // Schritt 2: Startdatum-Check clientseitig (DateDiff ignoriert Time-Component)
        ClearCollect(colAktiveEintraege, Filter(colLaufendeEintraege, IsBlank(Startdatum) || DateDiff(Today(), Startdatum, TimeUnit.Days) <= 0));
        ClearCollect(
            colAktiveFlat,
            AddColumns(
                colAktiveEintraege,
                PersonName, Person.DisplayName,
                PersonEmail, Lower(Person.Email),
                AuslastungPct, Auslastung * 100,
                AuslastungVorherPct, Coalesce(AuslastungVorher, 0) * 100
            )
        );
        // M365-Group-Members als Basis fuer die MA-Liste
        // (zeigt also auch MA, die noch keinen Eintrag in der SP-Liste haben)
        ClearCollect(
            colGroupMembers,
            AddColumns(
                Office365Groups.ListGroupMembers(varMSNUEGroupId).value,
                PersonName, displayName,
                PersonEmail, Lower(mail),
                PersonSurname, Coalesce(surname, displayName)
            )
        );
        ClearCollect(
            colAlleUser,
            Filter(
                colGroupMembers,
                !IsBlank(PersonEmail) And Len(PersonEmail) > 0
            )
        );
        // Aktuelle Auslastung pro MA (nur aus aktiven Eintraegen aggregiert)
        // GesamtVorher = Summe der zuletzt gespeicherten Vorgaengerwerte
        // StandModified = juengste Aenderung an einem Eintrag des MA
        ClearCollect(
            colAuslastungProMA,
            AddColumns(
                GroupBy(colAktiveFlat, PersonEmail, PersonName, Eintraege),
                GesamtAuslastung, RoundDown(Sum(Eintraege, AuslastungPct), 0),
                FreieKapa, 100 - RoundDown(Sum(Eintraege, AuslastungPct), 0),
                GesamtVorher, RoundDown(Sum(Eintraege, AuslastungVorherPct), 0),
                FreieKapaVorher, 100 - RoundDown(Sum(Eintraege, AuslastungVorherPct), 0),
                StandModified, Max(Eintraege, Modified)
            )
        );
        // Freie Kapazitaeten: JEDER MA aus der Liste. Hat er keine aktiven Eintraege,
        // gilt er als 0 % ausgelastet und hat 100 % frei. Gefiltert wird auf
        // GesamtAuslastung < 100 (d.h. Auslastung ist nicht bei 100 %).
        // Beispiel: 40 % ausgelastet -> 60 % FreieKapa -> erscheint in der Liste.
        ClearCollect(
            colFreieKapa,
            Filter(
                ForAll(
                    colAlleUser As u,
                    With(
                        {
                            aus: Coalesce(LookUp(colAuslastungProMA, PersonEmail = u.PersonEmail, GesamtAuslastung), 0),
                            vorher: Coalesce(LookUp(colAuslastungProMA, PersonEmail = u.PersonEmail, GesamtVorher), 0),
                            stand: LookUp(colAuslastungProMA, PersonEmail = u.PersonEmail, StandModified)
                        },
                        {
                            PersonName: u.PersonName,
                            PersonEmail: u.PersonEmail,
                            PersonSurname: u.PersonSurname,
                            GesamtAuslastung: aus,
                            FreieKapa: 100 - aus,
                            GesamtVorher: vorher,
                            FreieKapaVorher: 100 - vorher,
                            StandModified: stand
                        }
                    )
                ),
                GesamtAuslastung < 100
            )
        );
        // Alle Kapazitaeten: JEDER MA aus der Liste (auch 100 % ausgelastet).
        ClearCollect(
            colAlleKapa,
            ForAll(
                colAlleUser As u,
                With(
                    {
                        aus: Coalesce(LookUp(colAuslastungProMA, PersonEmail = u.PersonEmail, GesamtAuslastung), 0),
                        vorher: Coalesce(LookUp(colAuslastungProMA, PersonEmail = u.PersonEmail, GesamtVorher), 0),
                        stand: LookUp(colAuslastungProMA, PersonEmail = u.PersonEmail, StandModified)
                    },
                    {
                        PersonName: u.PersonName,
                        PersonEmail: u.PersonEmail,
                        PersonSurname: u.PersonSurname,
                        GesamtAuslastung: aus,
                        FreieKapa: 100 - aus,
                        GesamtVorher: vorher,
                        FreieKapaVorher: 100 - vorher,
                        StandModified: stand
                    }
                )
            )
        );
        // Toggle fuer die Ansicht: "Frei" = freie MA, "Alle" = alle MA inkl. 100 %
        Set(varKapaFilter, "Frei");
        // Sortierung der Kapa-Liste (gilt fuer Frei UND Alle):
        // "FreiDesc" (default), "FreiAsc", "Nachname"
        Set(varKapaSort, "FreiDesc");
        ClearCollect(
            colSortOptions,
            Table(
                { Code: "FreiDesc",  Label: "Frei: hoch → niedrig" },
                { Code: "FreiAsc",   Label: "Frei: niedrig → hoch" },
                { Code: "Nachname",  Label: "Nachname A → Z" }
            )
        );
        // Toggle fuer die Einsatz-Liste: "Auslaufend" = Top 10 nach Laufzeit, "Alle" = alle aktiven Einsaetze sortiert nach Person
        Set(varAuslFilter, "Auslaufend")
