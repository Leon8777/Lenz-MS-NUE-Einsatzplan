Screens:
  UserScreen:
    Properties:
      Fill: =RGBA(248, 250, 252, 1)
      OnVisible: |-
        =// SharePoint speichert 'Auslastung' als Bruchteil (0..1 = 0..100%).
        // Fuer die UI multiplizieren wir *100 zu AuslastungPct.
        // Refresh leert den lokalen SP-Cache nach Patch/Remove aus EditScreen
        // bzw. dem Delete-Dialog, damit Filter immer den Server-Stand sieht.
        Refresh('MS-NUE-Einsatzplan');
        // Schritt 1: SP-Query, voll delegierbar (Person + Laufzeit)
        ClearCollect(
            colMeineAlle,
            Filter('MS-NUE-Einsatzplan', Person.Email = varCurrentUser.Email && Laufzeit >= Today())
        );
        // Schritt 2: Startdatum-Check clientseitig (DateDiff ignoriert Time-Component)
        ClearCollect(
            colMeineAktiv,
            AddColumns(
                Filter(colMeineAlle, IsBlank(Startdatum) || DateDiff(Today(), Startdatum, TimeUnit.Days) <= 0),
                AuslastungPct, Auslastung * 100
            )
        );
        Set(varMeineAuslastung, RoundDown(Sum(colMeineAktiv, AuslastungPct), 0));
        Set(varMeineFreieKapa, Max(0, 100 - varMeineAuslastung))
    Children:
      - grp_UserRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(248, 250, 252, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - grp_UserHeaderWrap:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =47
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =47
                Children:
                  - grp_UserHeader:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(0, 110, 199, 1)
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =44
                        PaddingBottom: =6
                        PaddingLeft: =18
                        PaddingRight: =18
                        PaddingTop: =6
                      Children:
                        - lbl_UserHeaderTitle:
                            Control: Label
                            Properties:
                              Color: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =32
                              Size: =16
                              Text: ="Einsatzplan"
                              Width: =160
                        - lbl_UserGreeting:
                            Control: Label
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(186, 210, 232, 1)
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              Text: ="Hallo " & varCurrentUser.FullName
                        - btn_Admin:
                            Control: Button
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Outline
                              BasePaletteColor: =RGBA(255, 255, 255, 1)
                              BorderRadius: =8
                              Font: =Font.'Open Sans'
                              FontColor: =RGBA(255, 255, 255, 1)
                              FontSize: =12
                              FontWeight: =FontWeight.Semibold
                              OnSelect: =Navigate(AdminScreen, ScreenTransition.Cover)
                              Text: ="FK-Ansicht"
                              Visible: =varIsAdmin
                              Width: =128
                  - rec_UserHeaderAccent:
                      Control: Rectangle
                      Properties:
                        Fill: =RGBA(136, 125, 117, 1)
                        Height: =3
            - grp_UserActionBar:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(248, 250, 252, 1)
                  FillPortions: =0
                  Height: =100
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =76
                  PaddingBottom: =12
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =20
                Children:
                  - grp_ActionLeft:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =1
                        LayoutMinHeight: =0
                        RadiusBottomLeft: =2
                        RadiusBottomRight: =2
                        RadiusTopLeft: =2
                        RadiusTopRight: =2
                      Children:
                        - lbl_SectionTitle:
                            Control: Label
                            Properties:
                              Color: =RGBA(15, 23, 42, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.Height / 2
                              Size: =20
                              Text: ="Meine Einsätze (Nur Kunden KV Projekte)"
                        - lbl_SectionCount:
                            Control: Label
                            Properties:
                              Color: =RGBA(100, 116, 139, 1)
                              Font: =Font.'Open Sans'
                              Height: =Parent.Height / 2
                              PaddingBottom: =4
                              Size: =12
                              Text: |
                                =CountRows(Filter('MS-NUE-Einsatzplan', Person.Email = varCurrentUser.Email)) & " Einträge"
                  - btn_Neu:
                      Control: Button
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Primary
                        BasePaletteColor: =RGBA(0, 110, 199, 1)
                        BorderRadius: =10
                        Font: =Font.'Open Sans'
                        FontColor: =RGBA(255, 255, 255, 1)
                        FontSize: =14
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        OnSelect: |-
                          =Set(varSelectedItem, Blank());
                          Set(varFormMode, "New");
                          Navigate(
                              EditScreen,
                              ScreenTransition.Cover,
                              {
                                  ctxName: varCurrentUser.FullName,
                                  ctxKunde: "",
                                  ctxStart: Today(),
                                  ctxLaufzeit: Today() + 30,
                                  ctxAuslastung: 100,
                                  ctxProjektleiterEmail: ""
                              }
                          )
                        Text: ="+ Neuer Eintrag"
                        Width: =184
            - grp_MyLoadWrap:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(248, 250, 252, 1)
                  FillPortions: =0
                  Height: =116
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =116
                  PaddingBottom: =8
                  PaddingLeft: =24
                  PaddingRight: =24
                Children:
                  - grp_MyLoadCard:
                      Control: GroupContainer
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =RGBA(226, 232, 240, 1)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =108
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        Width: =Parent.Width - 48
                      Children:
                        - rec_MyLoadAccent:
                            Control: Rectangle
                            Properties:
                              Fill: =RGBA(0, 110, 199, 1)
                              Height: =108
                              Width: =6
                        - lbl_MyLoadTitle:
                            Control: Label
                            Properties:
                              Color: =RGBA(15, 23, 42, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =22
                              Size: =14
                              Text: ="Meine Auslastung"
                              Width: =260
                              X: =24
                              Y: =16
                        - lbl_MyLoadPercent:
                            Control: Label
                            Properties:
                              Color: =If(varMeineAuslastung >= 100, RGBA(46, 160, 67, 1), RGBA(220, 38, 38, 1))
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =44
                              Size: =28
                              Text: =varMeineAuslastung & " %"
                              Width: =140
                              X: =24
                              Y: =40
                        - lbl_MyLoadActive:
                            Control: Label
                            Properties:
                              Color: =RGBA(100, 116, 139, 1)
                              Font: =Font.'Open Sans'
                              Height: =20
                              Size: =11
                              Text: =CountRows(colMeineAktiv) & " aktive Einsätze"
                              Width: =180
                              X: =24
                              Y: =80
                        - grp_MyLoadBarTrack:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              Fill: =RGBA(241, 245, 249, 1)
                              Height: =12
                              RadiusBottomLeft: =999
                              RadiusBottomRight: =999
                              RadiusTopLeft: =999
                              RadiusTopRight: =999
                              Width: =Parent.Width - 360
                              X: =176
                              Y: =56
                            Children:
                              - rec_MyLoadBarFill:
                                  Control: Rectangle
                                  Properties:
                                    Fill: =If(varMeineAuslastung >= 100, RGBA(46, 160, 67, 1), RGBA(220, 38, 38, 1))
                                    Height: =12
                                    Width: =Min(varMeineAuslastung, 100) / 100 * Parent.Width
                        - lbl_MyLoadBarMin:
                            Control: Label
                            Properties:
                              Color: =RGBA(148, 163, 184, 1)
                              Font: =Font.'Open Sans'
                              Height: =14
                              Size: =9
                              Text: ="0 %"
                              Width: =40
                              X: =176
                              Y: =72
                        - lbl_MyLoadBarMax:
                            Control: Label
                            Properties:
                              Align: =Align.Right
                              Color: =RGBA(148, 163, 184, 1)
                              Font: =Font.'Open Sans'
                              Height: =14
                              Size: =9
                              Text: ="100 %"
                              Width: =60
                              X: =Parent.Width - 244
                              Y: =72
                        - grp_MyLoadFreeBadge:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =If(varMeineAuslastung >= 100, RGBA(187, 230, 198, 1), RGBA(252, 165, 165, 1))
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =If(varMeineAuslastung >= 100, RGBA(235, 248, 238, 1), RGBA(254, 226, 226, 1))
                              Height: =36
                              RadiusBottomLeft: =999
                              RadiusBottomRight: =999
                              RadiusTopLeft: =999
                              RadiusTopRight: =999
                              Width: =160
                              X: =Parent.Width - 180
                              Y: =36
                            Children:
                              - lbl_MyLoadFree:
                                  Control: Label
                                  Properties:
                                    Align: =Align.Center
                                    Color: =If(varMeineAuslastung >= 100, RGBA(34, 110, 52, 1), RGBA(185, 28, 28, 1))
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =36
                                    Size: =12
                                    Text: |
                                      =If(varMeineAuslastung >= 100, "Voll: " & varMeineAuslastung & " %", "Frei: " & varMeineFreieKapa & " %")
                                    Width: =160
            - grp_GalleryWrap:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(248, 250, 252, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =200
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =24
                  PaddingLeft: =24
                  PaddingRight: =24
                Children:
                  - gal_Eintraege:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Fill: =RGBA(248, 250, 252, 1)
                        Items: |
                          =Sort(SortByColumns(Filter('MS-NUE-Einsatzplan', Person.Email = varCurrentUser.Email), "Startdatum", SortOrder.Descending), If(!IsBlank(Startdatum) && DateDiff(Today(), Startdatum, TimeUnit.Days) > 0, 1, 0))
                        LayoutMinHeight: =200
                        TemplateFill: =RGBA(248, 250, 252, 1)
                        TemplatePadding: =12
                        TemplateSize: =168
                      Children:
                        - grp_Card:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =RGBA(226, 232, 240, 1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.Semibold
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =Parent.TemplateHeight - 12
                              RadiusBottomLeft: =16
                              RadiusBottomRight: =16
                              RadiusTopLeft: =16
                              RadiusTopRight: =16
                              Width: =Parent.TemplateWidth
                            Children:
                              - rec_AccentBar:
                                  Control: Rectangle
                                  Properties:
                                    Fill: =RGBA(0, 110, 199, 1)
                                    Height: =Parent.Height
                                    Width: =6
                              - lbl_ItemProjekt:
                                  Control: Label
                                  Properties:
                                    Color: =RGBA(15, 23, 42, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =26
                                    Size: =18
                                    Text: =ThisItem.Kunde
                                    Width: =Parent.Width * 0.55
                                    X: =24
                                    Y: =26
                              - lbl_ItemName:
                                  Control: Label
                                  Properties:
                                    Color: =RGBA(71, 85, 105, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =20
                                    Text: =ThisItem.Person.DisplayName
                                    Width: =Parent.Width * 0.55
                                    X: =24
                                    Y: =58
                              - grp_AuslastungBadge:
                                  Control: GroupContainer
                                  Variant: ManualLayout
                                  Properties:
                                    Fill: =If(!IsBlank(ThisItem.Startdatum) && DateDiff(Today(), ThisItem.Startdatum, TimeUnit.Days) > 0, RGBA(148, 163, 184, 1), RGBA(0, 110, 199, 1))
                                    Height: =34
                                    RadiusBottomLeft: =999
                                    RadiusBottomRight: =999
                                    RadiusTopLeft: =999
                                    RadiusTopRight: =999
                                    Width: =104
                                    X: =Parent.Width - 230
                                    Y: =22
                                  Children:
                                    - lbl_AuslastungBadge:
                                        Control: Label
                                        Properties:
                                          Align: =Align.Center
                                          Color: =RGBA(255, 255, 255, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Height: =34
                                          Size: =14
                                          Text: |
                                            =RoundDown(ThisItem.Auslastung * 100, 0) & " %"
                                          Width: =104
                              - ico_CalendarChip:
                                  Control: Button
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Subtle
                                    DisplayMode: =DisplayMode.View
                                    FontColor: =RGBA(100, 116, 139, 1)
                                    Height: =24
                                    Icon: ="Calendar"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Outline
                                    Layout: ='ButtonCanvas.Layout'.IconOnly
                                    Width: =24
                                    X: =20
                                    Y: =104
                              - lbl_Zeitraum:
                                  Control: Label
                                  Properties:
                                    Color: =RGBA(71, 85, 105, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =12
                                    Text: =Text(ThisItem.Startdatum, "[$-de-DE]dd.mm.yyyy") & " – " & Text(ThisItem.Laufzeit, "[$-de-DE]dd.mm.yyyy")
                                    Width: =Parent.Width * 0.55
                                    X: =48
                                    Y: =106
                              - btn_Edit:
                                  Control: Button
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Outline
                                    BasePaletteColor: =RGBA(0, 110, 199, 1)
                                    BorderRadius: =10
                                    FontColor: =RGBA(0, 110, 199, 1)
                                    Height: =40
                                    Icon: ="Edit"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Outline
                                    Layout: ='ButtonCanvas.Layout'.IconOnly
                                    OnSelect: |-
                                      =Set(varSelectedItem, ThisItem);
                                      Set(varFormMode, "Edit");
                                      Navigate(
                                          EditScreen,
                                          ScreenTransition.Cover,
                                          {
                                              ctxName: Coalesce(ThisItem.Name, ""),
                                              ctxKunde: Coalesce(ThisItem.Kunde, ""),
                                              ctxStart: Coalesce(ThisItem.Startdatum, Today()),
                                              ctxLaufzeit: Coalesce(ThisItem.Laufzeit, Today() + 30),
                                              ctxAuslastung: RoundDown(Coalesce(ThisItem.Auslastung, 0) * 100, 0),
                                              ctxProjektleiterEmail: Coalesce(ThisItem.Projektleiter.Email, "")
                                          }
                                      )
                                    Width: =40
                                    X: =Parent.Width - 92
                                    Y: =108
                              - btn_Delete:
                                  Control: Button
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Outline
                                    BasePaletteColor: =RGBA(220, 38, 38, 1)
                                    BorderRadius: =10
                                    FontColor: =RGBA(220, 38, 38, 1)
                                    Height: =40
                                    Icon: ="Delete"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Outline
                                    Layout: ='ButtonCanvas.Layout'.IconOnly
                                    OnSelect: =Set(varItemToDelete, ThisItem); Set(varShowDeleteDialog, true)
                                    Width: =40
                                    X: =Parent.Width - 44
                                    Y: =108
                              - lbl_ItemProjektleiter:
                                  Control: Label
                                  Properties:
                                    Color: =RGBA(71, 85, 105, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =12
                                    Text: |
                                      ="PL: " & Coalesce(ThisItem.Projektleiter.DisplayName, "—")
                                    Width: =Parent.Width * 0.55
                                    X: =48
                                    Y: =82
                              - ico_PersonChip:
                                  Control: Button
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Subtle
                                    DisplayMode: =DisplayMode.View
                                    FontColor: =RGBA(100, 116, 139, 1)
                                    Height: =24
                                    Icon: ="Person"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Outline
                                    Layout: ='ButtonCanvas.Layout'.IconOnly
                                    Width: =24
                                    X: =20
                                    Y: =80
                              - grp_FutureBadge:
                                  Control: GroupContainer
                                  Variant: ManualLayout
                                  Properties:
                                    BorderColor: =RGBA(252, 211, 77, 1)
                                    BorderThickness: =1
                                    Fill: =RGBA(254, 243, 199, 1)
                                    Height: =24
                                    RadiusBottomLeft: =999
                                    RadiusBottomRight: =999
                                    RadiusTopLeft: =999
                                    RadiusTopRight: =999
                                    Visible: =!IsBlank(ThisItem.Startdatum) && DateDiff(Today(), ThisItem.Startdatum, TimeUnit.Days) > 0
                                    Width: =140
                                    X: =Parent.Width - 248
                                    Y: =64
                                  Children:
                                    - lbl_FutureBadge:
                                        Control: Label
                                        Properties:
                                          Align: =Align.Center
                                          Color: =RGBA(180, 83, 9, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =24
                                          Size: =10
                                          Text: ="Noch nicht aktiv"
                                          Width: =140
      - grp_DeleteDialog:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            Visible: =varShowDeleteDialog
            Width: =Parent.Width
          Children:
            - rec_DialogBackdrop:
                Control: Rectangle
                Properties:
                  Fill: =RGBA(15, 23, 42, 0.55)
                  Height: =Parent.Height
                  OnSelect: =Set(varShowDeleteDialog, false)
                  Width: =Parent.Width
            - grp_DialogCard:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(226, 232, 240, 1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.Bold
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =240
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  Width: =460
                  X: =(Parent.Width - 460) / 2
                  Y: =(Parent.Height - 240) / 2
                Children:
                  - lbl_DialogTitle:
                      Control: Label
                      Properties:
                        Color: =RGBA(15, 23, 42, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =30
                        Size: =20
                        Text: ="Eintrag löschen?"
                        Width: =404
                        X: =28
                        Y: =24
                  - lbl_DialogBody:
                      Control: Label
                      Properties:
                        Color: =RGBA(71, 85, 105, 1)
                        Font: =Font.'Open Sans'
                        Height: =84
                        Size: =14
                        Text: |
                          ="Soll der Eintrag '" & varItemToDelete.Kunde & "' wirklich gelöscht werden?"
                        Width: =404
                        X: =28
                        Y: =64
                  - btn_DeleteCancel:
                      Control: Button
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Outline
                        BasePaletteColor: =RGBA(100, 116, 139, 1)
                        BorderRadius: =10
                        Font: =Font.'Open Sans'
                        FontColor: =RGBA(71, 85, 105, 1)
                        FontSize: =14
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        OnSelect: =Set(varShowDeleteDialog, false)
                        Text: ="Abbrechen"
                        Width: =128
                        X: =180
                        Y: =178
                  - btn_DeleteConfirm:
                      Control: Button
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Primary
                        BasePaletteColor: =RGBA(220, 38, 38, 1)
                        BorderRadius: =10
                        Font: =Font.'Open Sans'
                        FontColor: =RGBA(255, 255, 255, 1)
                        FontSize: =14
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        OnSelect: |-
                          =Remove('MS-NUE-Einsatzplan', varItemToDelete);
                          Refresh('MS-NUE-Einsatzplan');
                          ClearCollect(
                              colMeineAlle,
                              Filter('MS-NUE-Einsatzplan', Person.Email = varCurrentUser.Email && Laufzeit >= Today())
                          );
                          ClearCollect(
                              colMeineAktiv,
                              AddColumns(
                                  Filter(colMeineAlle, IsBlank(Startdatum) || DateDiff(Today(), Startdatum, TimeUnit.Days) <= 0),
                                  AuslastungPct, Auslastung * 100
                              )
                          );
                          Set(varMeineAuslastung, RoundDown(Sum(colMeineAktiv, AuslastungPct), 0));
                          Set(varMeineFreieKapa, Max(0, 100 - varMeineAuslastung));
                          Set(varShowDeleteDialog, false);
                          Set(varItemToDelete, Blank());
                          Notify("Eintrag gelöscht", NotificationType.Success)
                        Text: ="Löschen"
                        Width: =128
                        X: =318
                        Y: =178
