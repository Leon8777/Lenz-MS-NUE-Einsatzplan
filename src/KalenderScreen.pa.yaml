                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =20
                                          Size: =10
                                          Text: =">60%"
                                          Width: =34
                              - grp_KalLegendY:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =20
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =4
                                    LayoutMinHeight: =20
                                    LayoutMinWidth: =56
                                  Children:
                                    - rec_KalLegendY:
                                        Control: Rectangle
                                        Properties:
                                          Fill: =RGBA(250, 204, 21, 1)
                                          Height: =14
