Screens:
  KalenderScreen:
    Properties:
      Fill: =RGBA(248, 250, 252, 1)
      OnVisible: |-
        =// 1. Wochenanfang (Montag dieser Woche)
        Set(varCalStart, DateAdd(Today(), -(Weekday(Today(), StartOfWeek.Monday) - 1), TimeUnit.Days));
        // 2. 26 Wochen × 5 Werktage = 130 Tage; Mo-Fr; Wochenenden uebersprungen
        ClearCollect(
            colCalDays,
            ForAll(
                Sequence(130, 0) As n,
                With(
                    { d: DateAdd(varCalStart, n.Value + RoundDown(n.Value / 5, 0) * 2, TimeUnit.Days) },
                    {
                        Date: d,
                        DateKey: Text(d, "yyyy-mm-dd"),
                        KW: WeekNum(d, StartOfWeek.Monday),
                        DayOfWeek: Mod(n.Value, 5)
                    }
                )
            )
        );
        ClearCollect(colCalKWs, Distinct(colCalDays, KW));
        // 3. Aktive Eintraege im Sichtbereich (Laufzeit >= varCalStart)
        ClearCollect(
            colCalEintraege,
            Filter('MS-NUE-Einsatzplan', Laufzeit >= varCalStart)
        );
        // 4. Group-Members alphabetisch nach Nachname
        // Ausgeschlossene E-Mails (varExcludedEmails) werden hier rausgefiltert.
        ClearCollect(
            colCalMembers,
            SortByColumns(
                Filter(
                    AddColumns(
                        Office365Groups.ListGroupMembers(varMSNUEGroupId).value,
                        PersonName, displayName,
                        PersonEmail, Lower(mail),
                        PersonSurname, Coalesce(surname, displayName)
                    ),
                    !IsBlank(PersonEmail) And Len(PersonEmail) > 0
                    And IsBlank(LookUp(varExcludedEmails, Lower(Value) = PersonEmail))
                    And IsBlank(LookUp(varExcludedNames, Lower(Value) = Lower(PersonName)))
                ),
                "PersonSurname"
            )
        )
    Children:
      - grp_KalRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(248, 250, 252, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - grp_KalHeaderWrap:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =47
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =47
                Children:
                  - grp_KalHeader:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(0, 110, 199, 1)
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =44
                        PaddingBottom: =6
                        PaddingLeft: =18
                        PaddingRight: =18
                        PaddingTop: =6
                      Children:
                        - ico_KalBack_Btn:
                            Control: Button
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Subtle
                              BasePaletteColor: =RGBA(255, 255, 255, 1)
                              FontColor: =RGBA(255, 255, 255, 1)
                              Height: =30
                              Icon: ="ChevronLeft"
                              Layout: ='ButtonCanvas.Layout'.IconOnly
                              OnSelect: =Navigate(AdminScreen, ScreenTransition.UnCover)
                              Width: =32
                        - lbl_KalHeaderTitle:
                            Control: Label
                            Properties:
                              Color: =RGBA(255, 255, 255, 1)
                              FillPortions: =1
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =32
                              Size: =16
                              Text: ="Auslastungs-Kalender (26 Wochen)"
                        - grp_KalLegend:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =24
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              LayoutMinHeight: =24
                            Children:
                              - grp_KalLegendG:
