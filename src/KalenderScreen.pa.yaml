                                          Fill: =RGBA(22, 163, 74, 1)
                                          Height: =14
                                          Width: =14
                                    - lbl_KalLegendG:
                                        Control: Label
                                        Properties:
                                          Color: =RGBA(255, 255, 255, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =20
                                          Size: =10
