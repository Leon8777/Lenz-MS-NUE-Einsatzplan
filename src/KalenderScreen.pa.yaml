                                    - lbl_KalLegendY:
                                        Control: Label
                                        Properties:
                                          Color: =RGBA(255, 255, 255, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =20
                                          Size: =10
                                          Text: =">40%"
                                          Width: =34
                              - grp_KalLegendO:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =20
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =4
                                    LayoutMinHeight: =20
                                    LayoutMinWidth: =56
                                  Children:
                                    - rec_KalLegendO:
                                        Control: Rectangle
                                        Properties:
                                          Fill: =RGBA(249, 115, 22, 1)
                                          Height: =14
                                          Width: =14
                                    - lbl_KalLegendO:
                                        Control: Label
                                        Properties:
                                          Color: =RGBA(255, 255, 255, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =20
                                          Size: =10
                                          Text: =">20%"
                                          Width: =34
                              - grp_KalLegendR:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =20
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =4
                                    LayoutMinHeight: =20
                                    LayoutMinWidth: =56
                                  Children:
                                    - rec_KalLegendR:
                                        Control: Rectangle
                                        Properties:
                                          Fill: =RGBA(239, 68, 68, 1)
                                          Height: =14
                                          Width: =14
                                    - lbl_KalLegendR:
                                        Control: Label
                                        Properties:
                                          Color: =RGBA(255, 255, 255, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =20
                                          Size: =10
                                          Text: ="≤20%"
                                          Width: =34
                  - rec_KalHeaderAccent:
                      Control: Rectangle
                      Properties:
                        Fill: =RGBA(136, 125, 117, 1)
                        Height: =3
            - grp_KalBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(248, 250, 252, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  PaddingBottom: =14
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =4
                Children:
                  - htm_Kalender:
                      Control: HtmlViewer
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        HtmlText: |-
                          ="<table style='border-collapse:separate;border-spacing:0;font-family:Open Sans,Segoe UI,Arial;font-size:11px;width:max-content;margin-right:32px'>" &
                          "<thead><tr>" &
                          "<th style='padding:6px 8px;border:1px solid #e2e8f0;background:#e2e8f0;font-weight:700;text-align:left;min-width:160px;position:sticky;top:0;left:0;z-index:30'>Mitarbeiter</th>" &
                          Concat(colCalKWs As wk, "<th style='padding:4px 6px;border:1px solid #e2e8f0;background:#f1f5f9;font-weight:600;color:#0f172a;position:sticky;top:0;z-index:20'>KW" & wk.Value & "</th>") &
                          "<th style='min-width:80px;border:0;background:transparent;position:sticky;top:0;z-index:20'></th>" &
                          "</tr></thead><tbody>" &
                          Concat(
                              colCalMembers As member,
                              "<tr><td style='padding:4px 8px;border:1px solid #e2e8f0;background:#f8fafc;text-align:left;font-weight:600;color:#0f172a;position:sticky;left:0;z-index:10'>" & member.PersonName & "</td>" &
                              Concat(
                                  colCalKWs As wk,
                                  "<td style='padding:3px 4px;border:1px solid #e2e8f0;white-space:nowrap'>" &
                                  Concat(
                                      Filter(colCalDays, KW = wk.Value) As dy,
                                      With(
                                          { load: RoundDown(Sum(Filter(colCalEintraege, Lower(Person.Email) = member.PersonEmail && Coalesce(Startdatum, dy.Date) <= dy.Date && Laufzeit >= dy.Date), Auslastung) * 100, 0) },
                                          "<span style='display:inline-block;width:5px;height:18px;margin:0 1px;border-radius:1px;background:" &
                                          If(load > 80, "#16a34a", If(load > 60, "#84cc16", If(load > 40, "#facc15", If(load > 20, "#f97316", "#ef4444")))) &
                                          "'></span>"
                                      )
                                  ) &
                                  "</td>"
                              ) &
                              "<td style='min-width:80px;border:0;background:transparent'></td>" &
                              "</tr>"
                          ) &
                          "</tbody></table>"
                        PaddingLeft: =0
                        PaddingRight: =0
